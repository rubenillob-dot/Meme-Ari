<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="60%" stop-color="#0e071a"/>
      <stop offset="100%" stop-color="#06030c"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="boxBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)"/>
      <stop offset="50%" stop-color="rgba(168, 85, 247, 0.4)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.6)"/>
    </linearGradient>
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#techGrid)"/>

  <!-- Dashed Cyber Container Box -->
  <rect x="40" y="40" width="720" height="520" rx="20" fill="none" stroke="url(#boxBorder)" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Tech Corner Accents -->
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <path d="M 770 70 L 770 30 L 730 30" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <path d="M 30 530 L 30 570 L 70 570" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <path d="M 770 530 L 770 570 L 730 570" fill="none" stroke="#38BDF8" stroke-width="3"/>

  <!-- Center Hologram Circle -->
  <circle cx="400" cy="230" r="85" fill="rgba(56, 189, 248, 0.05)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="400" cy="230" r="70" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5"/>

  <!-- User Slot Icon (Silhouette with +) -->
  <g transform="translate(400, 230)" filter="url(#cyanGlow)">
    <!-- User Head -->
    <circle cx="0" cy="-22" r="26" fill="none" stroke="#38BDF8" stroke-width="3.5"/>
    <!-- User Body -->
    <path d="M -38 32 C -38 0, 38 0, 38 32" fill="none" stroke="#38BDF8" stroke-width="3.5"/>
    <!-- Plus symbol on badge -->
    <circle cx="28" cy="-26" r="14" fill="#0e071a" stroke="#FDE047" stroke-width="2.5"/>
    <path d="M 28 -32 L 28 -20 M 22 -26 L 34 -26" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Status Chip -->
  <g transform="translate(400, 360)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5"/>
    <circle cx="-85" cy="0" r="4.5" fill="#38BDF8"/>
    <text x="-70" y="5" font-family="'Rajdhani', sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#38BDF8">SLOT DISPONIBLE</text>
  </g>

  <!-- Main Headline -->
  <text x="400" y="430" text-anchor="middle" font-family="'Rajdhani', 'Impact', sans-serif" font-size="44" font-weight="900" letter-spacing="1" fill="#FFFFFF">
    HUECO LIBRE
  </text>

  <!-- Subtitle -->
  <text x="400" y="475" text-anchor="middle" font-family="'Rajdhani', sans-serif" font-size="22" font-weight="700" letter-spacing="1.5" fill="#A855F7">
    EXPEDIENTE #09 // USUARIOX
  </text>

  <!-- Hint -->
  <text x="400" y="515" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#94A3B8">
    Espacio reservado para la incorporación de un nuevo participante
  </text>
</svg>